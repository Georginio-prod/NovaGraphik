# Railway / Nixpacks config for the backend service
# Build/start commands run from the backend/ subfolder
# (Railway "Root Directory" must be set to `backend`).

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci --omit=dev"]

[start]
cmd = "npm start"

[variables]
NODE_ENV = "production"
