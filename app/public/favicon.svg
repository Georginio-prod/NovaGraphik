  <circle cx="32" cy="33" r="24" fill="none" stroke="#6dbc84" stroke-width="1.4"/>
  <!-- compass rays -->
  <g stroke="#6dbc84" stroke-width="1.5" stroke-linecap="round">
    <line x1="32" y1="6" x2="32" y2="60"/>
    <line x1="5" y1="33" x2="59" y2="33"/>
    <line x1="14" y1="15" x2="50" y2="51"/>
    <line x1="50" y1="15" x2="14" y2="51"/>
  </g>
  <!-- central 4-point star -->
