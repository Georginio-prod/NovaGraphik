# Railway / Nixpacks config for the frontend service
# Build/start commands run from the app/ subfolder
# (Railway "Root Directory" must be set to `app`).

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"

[variables]
NODE_ENV = "production"
