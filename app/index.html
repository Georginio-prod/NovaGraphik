<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#034159" />
    <!-- Default SEO. unhead overrides title/description/canonical per route at
         runtime; these defaults cover the initial paint and JS-less crawlers. -->
    <meta
      name="description"
      content="Nova Graphik Visu — agence de communication visuelle : identité de marque, supports imprimés, motion design, 3D, photo et sites web sur mesure."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://novagraphikvisu.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nova Graphik Visu" />
    <meta property="og:title" content="Nova Graphik Visu — Communication visuelle &amp; design" />
    <meta
      property="og:description"
      content="Agence de communication visuelle : identité de marque, supports imprimés, motion design, 3D, photo et sites web sur mesure."
    />
    <meta property="og:url" content="https://novagraphikvisu.com/" />
    <meta property="og:image" content="https://novagraphikvisu.com/og-cover.jpg" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Archivo:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Nova Graphik Visu</title>
    <!-- Boot splash styles, inlined so the loader paints before the JS bundle. -->
    <style>
      #boot-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: #f8faf9; transition: opacity 0.45s ease; font-family: 'Cormorant Garamond', Georgia, serif;
      }
      html.dark #boot-loader { background: #0a1519; }
      #boot-loader.is-hiding { opacity: 0; pointer-events: none; }
      #boot-loader .boot-word {
        font-size: 26px; font-weight: 600; letter-spacing: 0.04em; color: #034159;
      }
      html.dark #boot-loader .boot-word { color: #eef4f5; }
      #boot-loader .boot-word b { color: #0cf25d; font-style: italic; }
      #boot-loader .boot-spinner {
        width: 44px; height: 44px; border-radius: 9999px;
        border: 3px solid #e6ecec; border-top-color: #0cf25d; animation: bootSpin 0.8s linear infinite;
      }
      html.dark #boot-loader .boot-spinner { border-color: #1e3339; border-top-color: #0cf25d; }
      @keyframes bootSpin { 100% { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot-loader .boot-spinner { animation-duration: 2s; } }
    </style>
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nova-theme');
          var dark =
            t === 'dark' ||
            (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <div id="boot-loader">
      <div class="boot-spinner"></div>
      <div class="boot-word">Nova <b>Graphik</b></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
