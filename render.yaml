services:
  - type: web
    name: novagraphik-api
    runtime: node
    plan: free
    region: frankfurt
    branch: develop
    buildCommand: npm ci
    startCommand: node server/index.js
    autoDeploy: true
    healthCheckPath: /api/services
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 3001
      - key: VITE_SUPABASE_URL
        sync: false       # à remplir dans le dashboard Render
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: DB_PATH
        value: /var/data/data.sqlite
    disk:
      name: nova-data
      mountPath: /var/data
      sizeGB: 1
